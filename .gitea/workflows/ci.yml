name: Continuous Integration

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  repository-quality:
    name: Repository formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  web:
    name: Web application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint web application
        run: npm run lint --workspace @wits-world/web

      - name: Type-check web application
        run: npm run type-check --workspace @wits-world/web

      - name: Test web application
        run: npm test --workspace @wits-world/web

      - name: Build web application
        run: npm run build --workspace @wits-world/web

  api:
    name: API application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint API application
        run: npm run lint --workspace @wits-world/api

      - name: Type-check API application
        run: npm run type-check --workspace @wits-world/api

      - name: Test API application
        run: npm test --workspace @wits-world/api

      - name: Build API application
        run: npm run build --workspace @wits-world/api

  documentation:
    name: Documentation application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint documentation application
        run: npm run lint --workspace @wits-world/docs

      - name: Type-check documentation application
        run: npm run type-check --workspace @wits-world/docs

      - name: Test documentation application
        run: npm test --workspace @wits-world/docs

      - name: Build documentation application
        run: npm run build --workspace @wits-world/docs