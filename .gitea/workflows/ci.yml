name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validation:
    name: Repository and application validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Check formatting
        run: npm run format:check

      - name: Lint web application
        run: npm run lint --workspace @wits-world/web

      - name: Type-check web application
        run: npm run type-check --workspace @wits-world/web

      - name: Test web application with coverage
        run: npm run test:coverage --workspace @wits-world/web

      - name: Build web application
        run: npm run build:bundle --workspace @wits-world/web

      - name: Lint API application
        run: npm run lint --workspace @wits-world/api

      - name: Type-check API application
        run: npm run type-check --workspace @wits-world/api

      - name: Test API application with coverage
        run: npm run test:coverage --workspace @wits-world/api

      - name: Build API application
        run: npm run build --workspace @wits-world/api

      - name: Lint documentation application
        run: npm run lint --workspace @wits-world/docs

      - name: Type-check documentation application
        run: npm run type-check --workspace @wits-world/docs

      - name: Test documentation application
        run: npm test --workspace @wits-world/docs

      - name: Build documentation application
        run: npm run build --workspace @wits-world/docs

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  deploy-api:
    name: Deploy API to Azure
    needs:
      - validation
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: azure-deploy

    env:
      DEPLOY_SHA: ${{ gitea.sha }}
      PREVIOUS_SHA: ${{ gitea.event.before }}
      GITEA_JOB_TOKEN: ${{ gitea.token }}
      REPOSITORY_URL: https://sdp.ms.wits.ac.za/gradient-ascent/Wits-World.git
      AZURE_RESOURCE_GROUP: witsworld-rg
      AZURE_WEBAPP_NAME: witsworld-api
      NPM_CACHE_ROOT: /tmp/witsworld-npm-cache

    steps:
      - name: Check out exact main commit
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          rm -rf "$DEPLOY_ROOT"
          mkdir -p "$DEPLOY_ROOT/repository"

          cd "$DEPLOY_ROOT/repository"

          git init
          git remote add origin "$REPOSITORY_URL"

          AUTH_HEADER="$(
            printf 'x-access-token:%s' "$GITEA_JOB_TOKEN" |
              base64 -w0
          )"

          git \
            -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
            fetch --depth=2 origin "$DEPLOY_SHA"

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            git \
              -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
              fetch --depth=1 origin "$PREVIOUS_SHA" || true
          fi

          git checkout --detach "$DEPLOY_SHA"

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "Expected commit: $DEPLOY_SHA"
            echo "Fetched commit:  $ACTUAL_SHA"
            echo "Refusing to deploy the wrong commit."
            exit 1
          fi

      - name: Detect API deployment changes
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"
          DEPLOY_MARKER="$DEPLOY_ROOT/deploy-required"

          cd "$DEPLOY_ROOT/repository"
          rm -f "$DEPLOY_MARKER"

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            BASE_SHA="$PREVIOUS_SHA"
          else
            echo "The push-before commit is unavailable; API deployment is required."
            touch "$DEPLOY_MARKER"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$DEPLOY_SHA" -- \
            .nvmrc \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            apps/api \
            database
          then
            echo "No API, database, or shared runtime changes detected; API deployment will be skipped."
          else
            echo "API, database, or shared runtime changes detected; API deployment is required."
            touch "$DEPLOY_MARKER"
          fi

      - name: Build production API package
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping the production API build."
            exit 0
          fi

          cd "$DEPLOY_ROOT/repository"
          mkdir -p "$NPM_CACHE_ROOT"

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$NPM_CACHE_ROOT:/npm-cache" \
            -w /workspace \
            node:24-bookworm-slim \
            sh -lc '
              set -eu

              npm install -g npm@11.18.0 \
                --cache /npm-cache \
                --no-audit \
                --fund=false >/dev/null

              echo "Node: $(node --version)"
              echo "npm:  $(npm --version)"

              npm ci \
                --cache /npm-cache \
                --prefer-offline \
                --no-audit \
                --fund=false

              npm run build --workspace @wits-world/api

              test -f apps/api/dist/server.js

              rm -rf node_modules

              npm ci \
                --cache /npm-cache \
                --prefer-offline \
                --omit=dev \
                --workspace @wits-world/api \
                --include-workspace-root=false \
                --no-audit \
                --fund=false
            '

          rm -rf "$DEPLOY_ROOT/package"
          mkdir -p "$DEPLOY_ROOT/package/apps/api"

          cp package.json package-lock.json \
            "$DEPLOY_ROOT/package/"

          cp apps/api/package.json \
            "$DEPLOY_ROOT/package/apps/api/"

          cp -a apps/api/dist \
            "$DEPLOY_ROOT/package/apps/api/"

          cp -a node_modules \
            "$DEPLOY_ROOT/package/"

          cp -a database \
            "$DEPLOY_ROOT/package/"

          (
            cd "$DEPLOY_ROOT/package"
            zip -qr "$DEPLOY_ROOT/witsworld-api-deploy.zip" .
          )

          test -s "$DEPLOY_ROOT/witsworld-api-deploy.zip"

          unzip -l "$DEPLOY_ROOT/witsworld-api-deploy.zip" |
            grep 'apps/api/dist/server.js'

      - name: Authenticate to Azure
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping Azure authentication for the API."
            exit 0
          fi

          az login --identity --output none
          az account set --subscription "Azure for Students"

          az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query '{name:name,state:state}' \
            --output table

      - name: Deploy API to Azure
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping the API deployment."
            exit 0
          fi

          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path "$DEPLOY_ROOT/witsworld-api-deploy.zip" \
            --type zip \
            --clean true \
            --restart true \
            --track-status false \
            --output none

      - name: Verify production health
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping API health verification because no deployment occurred."
            exit 0
          fi

          API_HOST="$(
            az webapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query defaultHostName \
              --output tsv
          )"

          HEALTH_BODY="$(mktemp)"

          for attempt in $(seq 1 60); do
            STATUS="$(
              curl \
                --silent \
                --show-error \
                --output "$HEALTH_BODY" \
                --write-out '%{http_code}' \
                --max-time 10 \
                "https://${API_HOST}/health" || true
            )"

            if [ "$STATUS" = "200" ]; then
              echo "Production API is healthy:"
              cat "$HEALTH_BODY"
              rm -f "$HEALTH_BODY"
              exit 0
            fi

            echo "Health check ${attempt}/60 returned '${STATUS:-request-error}'."
            sleep 10
          done

          echo "Production API did not become healthy."
          rm -f "$HEALTH_BODY"

          az webapp log startup show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" || true

          exit 1

      - name: Clean deployment workspace
        if: ${{ always() }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          az logout >/dev/null 2>&1 || true

          if [ -d "$DEPLOY_ROOT" ]; then
            docker run --rm \
              -v "$DEPLOY_ROOT:/cleanup" \
              node:24-bookworm-slim \
              sh -lc 'rm -rf /cleanup/* /cleanup/.[!.]* /cleanup/..?*'

            rm -rf "$DEPLOY_ROOT"
          fi

  deploy-web:
    name: Deploy Web to Azure
    needs:
      - deploy-api
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: azure-deploy

    env:
      DEPLOY_SHA: ${{ gitea.sha }}
      PREVIOUS_SHA: ${{ gitea.event.before }}
      GITEA_JOB_TOKEN: ${{ gitea.token }}
      REPOSITORY_URL: https://sdp.ms.wits.ac.za/gradient-ascent/Wits-World.git
      AZURE_RESOURCE_GROUP: witsworld-rg
      AZURE_WEBAPP_NAME: witsworld-web
      NPM_CACHE_ROOT: /tmp/witsworld-npm-cache

      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
      VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
      VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
      VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}

    steps:
      - name: Check out exact main commit
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          rm -rf "$DEPLOY_ROOT"
          mkdir -p "$DEPLOY_ROOT/repository"

          cd "$DEPLOY_ROOT/repository"

          git init
          git remote add origin "$REPOSITORY_URL"

          AUTH_HEADER="$(
            printf 'x-access-token:%s' "$GITEA_JOB_TOKEN" |
              base64 -w0
          )"

          git \
            -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
            fetch --depth=2 origin "$DEPLOY_SHA"

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            git \
              -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
              fetch --depth=1 origin "$PREVIOUS_SHA" || true
          fi

          git checkout --detach "$DEPLOY_SHA"

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "Expected commit: $DEPLOY_SHA"
            echo "Fetched commit:  $ACTUAL_SHA"
            echo "Refusing to deploy the wrong commit."
            exit 1
          fi

      - name: Detect web deployment changes
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"
          DEPLOY_MARKER="$DEPLOY_ROOT/deploy-required"

          cd "$DEPLOY_ROOT/repository"
          rm -f "$DEPLOY_MARKER"

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            BASE_SHA="$PREVIOUS_SHA"
          else
            echo "The push-before commit is unavailable; web deployment is required."
            touch "$DEPLOY_MARKER"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$DEPLOY_SHA" -- \
            .nvmrc \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            apps/web
          then
            echo "No web or shared runtime changes detected; web deployment will be skipped."
          else
            echo "Web or shared runtime changes detected; web deployment is required."
            touch "$DEPLOY_MARKER"
          fi

      - name: Validate production web configuration
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping production web configuration validation."
            exit 0
          fi

          for variable in \
            VITE_API_BASE_URL \
            VITE_AUTH0_DOMAIN \
            VITE_AUTH0_CLIENT_ID \
            VITE_AUTH0_AUDIENCE \
            VITE_MAPBOX_ACCESS_TOKEN
          do
            if [ -z "${!variable:-}" ]; then
              echo "${variable} is not configured."
              exit 1
            fi
          done

      - name: Build production web package
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping the production web build."
            exit 0
          fi

          cd "$DEPLOY_ROOT/repository"
          mkdir -p "$NPM_CACHE_ROOT"

          docker run --rm \
            -e VITE_API_BASE_URL \
            -e VITE_AUTH0_DOMAIN \
            -e VITE_AUTH0_CLIENT_ID \
            -e VITE_AUTH0_AUDIENCE \
            -e VITE_MAPBOX_ACCESS_TOKEN \
            -v "$PWD:/workspace" \
            -v "$NPM_CACHE_ROOT:/npm-cache" \
            -w /workspace \
            node:24-bookworm-slim \
            sh -lc '
              set -eu

              npm install -g npm@11.18.0 \
                --cache /npm-cache \
                --no-audit \
                --fund=false >/dev/null

              echo "Node: $(node --version)"
              echo "npm:  $(npm --version)"

              npm ci \
                --cache /npm-cache \
                --prefer-offline \
                --no-audit \
                --fund=false

              npm run build --workspace @wits-world/web

              test -f apps/web/dist/index.html
              test -d apps/web/dist/assets
            '

          (
            cd apps/web/dist
            zip -qr "$DEPLOY_ROOT/witsworld-web-deploy.zip" .
          )

          test -s "$DEPLOY_ROOT/witsworld-web-deploy.zip"

          unzip -l "$DEPLOY_ROOT/witsworld-web-deploy.zip" |
            grep 'index.html'

          unzip -l "$DEPLOY_ROOT/witsworld-web-deploy.zip" |
            grep 'assets/'

      - name: Authenticate to Azure
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping Azure authentication for the web application."
            exit 0
          fi

          az login --identity --output none
          az account set --subscription "Azure for Students"

          az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query '{name:name,state:state}' \
            --output table

      - name: Deploy web application to Azure
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping the web deployment."
            exit 0
          fi

          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path "$DEPLOY_ROOT/witsworld-web-deploy.zip" \
            --type zip \
            --clean true \
            --restart true \
            --track-status false \
            --output none

      - name: Verify production website
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping web health verification because no deployment occurred."
            exit 0
          fi

          WEB_HOST="$(
            az webapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query defaultHostName \
              --output tsv
          )"

          for attempt in $(seq 1 60); do
            ROOT_STATUS="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 10 \
                "https://${WEB_HOST}/" || true
            )"

            ABOUT_STATUS="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 10 \
                "https://${WEB_HOST}/about" || true
            )"

            if [ "$ROOT_STATUS" = "200" ] && [ "$ABOUT_STATUS" = "200" ]; then
              echo "Production website is healthy."
              echo "Home:  HTTP ${ROOT_STATUS}"
              echo "About: HTTP ${ABOUT_STATUS}"
              exit 0
            fi

            echo "Website check ${attempt}/60: home=${ROOT_STATUS:-request-error}, about=${ABOUT_STATUS:-request-error}."
            sleep 10
          done

          echo "Production website did not become healthy."

          az webapp log startup show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" || true

          exit 1

      - name: Clean deployment workspace
        if: ${{ always() }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          az logout >/dev/null 2>&1 || true

          if [ -d "$DEPLOY_ROOT" ]; then
            docker run --rm \
              -v "$DEPLOY_ROOT:/cleanup" \
              node:24-bookworm-slim \
              sh -lc 'rm -rf /cleanup/* /cleanup/.[!.]* /cleanup/..?*'

            rm -rf "$DEPLOY_ROOT"
          fi
