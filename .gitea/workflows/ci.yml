name: Continuous Integration

on:
  push:
    branches:
      - main

jobs:
  static-analysis:
    name: Run static analysis
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false
        env:
          NPM_CONFIG_CACHE: /opt/wits-world/npm-cache

      - name: Check formatting, linting, and types
        run: |
          set +e

          FAILED_CHECKS=()

          run_check() {
            local label="$1"
            shift

            echo "::group::${label}"
            local started_at=$SECONDS

            "$@"
            local status=$?

            echo "${label} completed in $((SECONDS - started_at)) seconds with exit code ${status}."
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "::error::${label} failed with exit code ${status}."
              FAILED_CHECKS+=("$label")
            fi
          }

          run_check "Formatting check" npm run format:check
          run_check "Lint" npm run lint
          run_check "Type-check" npm run type-check

          if [ "${#FAILED_CHECKS[@]}" -ne 0 ]; then
            printf 'Static analysis failed: %s\n' "${FAILED_CHECKS[*]}"
            exit 1
          fi

          echo "All static-analysis checks passed."

  test:
    name: Test applications with coverage
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false
        env:
          NPM_CONFIG_CACHE: /opt/wits-world/npm-cache

      - name: Test web application with coverage
        run: time npm run test:coverage --workspace @wits-world/web

      - name: Test API application with coverage
        run: time npm run validate:api:coverage

      - name: Test documentation application
        run: time npm test --workspace @wits-world/docs

      - name: Generate coverage badge
        run: time npm run coverage:badge

      - name: Upload coverage reports
        if: ${{ always() }}
        # Keep the known-working v3 protocol until v4 is verified on this Gitea instance.
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build applications
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false
        env:
          NPM_CONFIG_CACHE: /opt/wits-world/npm-cache

      - name: Build web application
        run: time npm run build:bundle --workspace @wits-world/web

      - name: Build API application
        run: time npm run validate:api:build

      - name: Build documentation application
        run: time npm run build --workspace @wits-world/docs

      - name: Detect web deployment changes for candidate artifact
        id: candidate_web_changes
        env:
          DEPLOY_SHA: ${{ gitea.sha }}
          PREVIOUS_SHA: ${{ gitea.event.before }}
        run: |
          set -euo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "Expected commit: $DEPLOY_SHA"
            echo "Checked-out commit: $ACTUAL_SHA"
            echo "Refusing to produce an artifact for the wrong commit."
            exit 1
          fi

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]
          then
            if ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA" || true
            fi
          fi

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            BASE_SHA="$PREVIOUS_SHA"
          else
            echo "The push-before commit is unavailable; a candidate web artifact is required."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git diff --quiet "$BASE_SHA" "$DEPLOY_SHA" -- \
            .gitea/workflows/ci.yml \
            .nvmrc \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            apps/web \
            packages/account-policy
          DIFF_STATUS=$?
          set -e

          case "$DIFF_STATUS" in
            0)
              echo "No web or shared runtime changes detected; no candidate web artifact is required."
              echo "required=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "Web or shared runtime changes detected; a candidate web artifact is required."
              echo "required=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "The web change comparison failed; defaulting to producing a candidate artifact."
              echo "required=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Validate candidate production web configuration
        if: ${{ steps.candidate_web_changes.outputs.required == 'true' }}
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          for variable in \
            VITE_API_BASE_URL \
            VITE_AUTH0_DOMAIN \
            VITE_AUTH0_CLIENT_ID \
            VITE_AUTH0_AUDIENCE \
            VITE_MAPBOX_ACCESS_TOKEN
          do
            if [ -z "${!variable:-}" ]; then
              echo "${variable} is not configured."
              exit 1
            fi
          done

      - name: Build candidate production web application
        if: ${{ steps.candidate_web_changes.outputs.required == 'true' }}
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
        run: time npm run build --workspace @wits-world/web

      - name: Package candidate production web artifact
        if: ${{ steps.candidate_web_changes.outputs.required == 'true' }}
        env:
          DEPLOY_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail

          PACKAGE_STARTED_AT=$SECONDS

          CANDIDATE_ROOT="/tmp/witsworld-web-candidate-${DEPLOY_SHA}"

          rm -rf "$CANDIDATE_ROOT"
          mkdir -p "$CANDIDATE_ROOT"

          test -f apps/web/dist/index.html
          test -d apps/web/dist/assets

          (
            cd apps/web/dist
            zip -qr "$CANDIDATE_ROOT/witsworld-web-deploy.zip" .
          )

          printf '%s\n' "$DEPLOY_SHA" > "$CANDIDATE_ROOT/commit-sha.txt"

          (
            cd "$CANDIDATE_ROOT"
            sha256sum witsworld-web-deploy.zip > witsworld-web-deploy.zip.sha256
          )

          test -s "$CANDIDATE_ROOT/witsworld-web-deploy.zip"
          unzip -t "$CANDIDATE_ROOT/witsworld-web-deploy.zip" >/dev/null

          unzip -l "$CANDIDATE_ROOT/witsworld-web-deploy.zip" |
            grep 'index.html'

          unzip -l "$CANDIDATE_ROOT/witsworld-web-deploy.zip" |
            grep 'assets/'

          echo "Web artifact packaging completed in $((SECONDS - PACKAGE_STARTED_AT)) seconds."

      - name: Upload candidate production web artifact
        if: ${{ steps.candidate_web_changes.outputs.required == 'true' }}
        # Keep the known-working v3 protocol until v4 is verified on this Gitea instance.
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: web-deploy-${{ gitea.sha }}
          path: |
            /tmp/witsworld-web-candidate-${{ gitea.sha }}/witsworld-web-deploy.zip
            /tmp/witsworld-web-candidate-${{ gitea.sha }}/commit-sha.txt
            /tmp/witsworld-web-candidate-${{ gitea.sha }}/witsworld-web-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Detect API deployment changes for production artifact
        id: api_artifact_changes
        env:
          DEPLOY_SHA: ${{ gitea.sha }}
          PREVIOUS_SHA: ${{ gitea.event.before }}
        run: |
          set -euo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "Expected commit: $DEPLOY_SHA"
            echo "Checked-out commit: $ACTUAL_SHA"
            echo "Refusing to produce an artifact for the wrong commit."
            exit 1
          fi

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]
          then
            if ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA" || true
            fi
          fi

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            BASE_SHA="$PREVIOUS_SHA"
          else
            echo "The push-before commit is unavailable; a production API artifact is required."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git diff --quiet "$BASE_SHA" "$DEPLOY_SHA" -- \
            .gitea/workflows/ci.yml \
            .nvmrc \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            apps/api \
            packages/account-policy \
            packages/game-rules \
            scripts/prepare-api.mjs \
            database
          DIFF_STATUS=$?
          set -e

          case "$DIFF_STATUS" in
            0)
              echo "No API, database, or shared runtime changes detected; no production API artifact is required."
              echo "required=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "API, database, or shared runtime changes detected; a production API artifact is required."
              echo "required=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "The API change comparison failed; defaulting to producing a production artifact."
              echo "required=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Package production API artifact
        if: ${{ steps.api_artifact_changes.outputs.required == 'true' }}
        env:
          DEPLOY_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail

          PACKAGE_STARTED_AT=$SECONDS

          ARTIFACT_ROOT="/tmp/witsworld-api-artifact-${DEPLOY_SHA}"

          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT/package/apps/api"

          test -f apps/api/dist/server.js
          test -f apps/api/dist/database/release.js

          rm -rf node_modules

          NPM_TOOL_ROOT="$(mktemp -d /tmp/witsworld-api-npm.XXXXXX)"
          trap 'rm -rf "$NPM_TOOL_ROOT"' EXIT

          npm install \
            --prefix "$NPM_TOOL_ROOT" \
            --no-save \
            npm@11.18.0 \
            --no-audit \
            --fund=false >/dev/null

          NPM_CLI="$NPM_TOOL_ROOT/node_modules/npm/bin/npm-cli.js"
          test -f "$NPM_CLI"

          echo "npm: $(node "$NPM_CLI" --version)"

          node "$NPM_CLI" ci \
            --prefer-offline \
            --omit=dev \
            --workspace @wits-world/api \
            --include-workspace-root=false \
            --no-audit \
            --fund=false

          cp package.json package-lock.json \
            "$ARTIFACT_ROOT/package/"

          cp apps/api/package.json \
            "$ARTIFACT_ROOT/package/apps/api/"

          cp -a apps/api/dist \
            "$ARTIFACT_ROOT/package/apps/api/"

          cp -a node_modules \
            "$ARTIFACT_ROOT/package/"

          ACCOUNT_POLICY_RUNTIME_PACKAGE="$ARTIFACT_ROOT/package/node_modules/@wits-world/account-policy"
          GAME_RULES_RUNTIME_PACKAGE="$ARTIFACT_ROOT/package/node_modules/@wits-world/game-rules"

          test -L "$ACCOUNT_POLICY_RUNTIME_PACKAGE"
          rm "$ACCOUNT_POLICY_RUNTIME_PACKAGE"
          mkdir -p "$ACCOUNT_POLICY_RUNTIME_PACKAGE"

          cp packages/account-policy/package.json \
            "$ACCOUNT_POLICY_RUNTIME_PACKAGE/"

          cp -a packages/account-policy/dist \
            "$ACCOUNT_POLICY_RUNTIME_PACKAGE/"

          test -f "$ACCOUNT_POLICY_RUNTIME_PACKAGE/dist/src/index.js"
          test ! -L "$ACCOUNT_POLICY_RUNTIME_PACKAGE"

          test -L "$GAME_RULES_RUNTIME_PACKAGE"
          rm "$GAME_RULES_RUNTIME_PACKAGE"
          mkdir -p "$GAME_RULES_RUNTIME_PACKAGE"

          cp packages/game-rules/package.json \
            "$GAME_RULES_RUNTIME_PACKAGE/"

          cp -a packages/game-rules/dist \
            "$GAME_RULES_RUNTIME_PACKAGE/"

          test -f "$GAME_RULES_RUNTIME_PACKAGE/dist/src/index.js"
          test ! -L "$GAME_RULES_RUNTIME_PACKAGE"

          cp -a database \
            "$ARTIFACT_ROOT/package/"

          (
            cd "$ARTIFACT_ROOT/package"
            zip -qr "$ARTIFACT_ROOT/witsworld-api-deploy.zip" .
          )

          printf '%s\n' "$DEPLOY_SHA" > "$ARTIFACT_ROOT/commit-sha.txt"

          (
            cd "$ARTIFACT_ROOT"
            sha256sum witsworld-api-deploy.zip > witsworld-api-deploy.zip.sha256
          )

          test -s "$ARTIFACT_ROOT/witsworld-api-deploy.zip"
          unzip -t "$ARTIFACT_ROOT/witsworld-api-deploy.zip" >/dev/null

          RUNTIME_SMOKE_ROOT="$(mktemp -d /tmp/witsworld-api-runtime.XXXXXX)"
          trap 'rm -rf "$NPM_TOOL_ROOT" "$RUNTIME_SMOKE_ROOT"' EXIT

          unzip -q "$ARTIFACT_ROOT/witsworld-api-deploy.zip" \
            -d "$RUNTIME_SMOKE_ROOT"

          (
            cd "$RUNTIME_SMOKE_ROOT"
            node --input-type=module \
              --eval "await import('@wits-world/account-policy'); console.log('Imported @wits-world/account-policy from the API artifact')"
            node --input-type=module \
              --eval "await import('@wits-world/game-rules'); console.log('Imported @wits-world/game-rules from the API artifact')"
          )

          unzip -l "$ARTIFACT_ROOT/witsworld-api-deploy.zip" |
            grep 'apps/api/dist/server.js'

          unzip -l "$ARTIFACT_ROOT/witsworld-api-deploy.zip" |
            grep 'apps/api/dist/database/release.js'

          echo "API artifact packaging completed in $((SECONDS - PACKAGE_STARTED_AT)) seconds."

      - name: Upload production API artifact
        if: ${{ steps.api_artifact_changes.outputs.required == 'true' }}
        # Keep the known-working v3 protocol until v4 is verified on this Gitea instance.
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: api-deploy-${{ gitea.sha }}
          path: |
            /tmp/witsworld-api-artifact-${{ gitea.sha }}/witsworld-api-deploy.zip
            /tmp/witsworld-api-artifact-${{ gitea.sha }}/commit-sha.txt
            /tmp/witsworld-api-artifact-${{ gitea.sha }}/witsworld-api-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 14

  validation:
    name: Repository and application validation
    needs:
      - static-analysis
      - test
      - build
    runs-on: wits-world-ci

    steps:
      - name: Confirm validation gates passed
        run: echo "All repository and application validation jobs passed."

  publish-coverage:
    name: Publish live coverage badge
    needs:
      - validation
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: wits-world-ci

    steps:
      - name: Check out repository for coverage publication
        uses: https://github.com/actions/checkout@v4

      - name: Download coverage reports
        uses: https://github.com/actions/download-artifact@v3
        with:
          name: coverage-reports
          path: coverage

      - name: Publish live coverage badge
        env:
          GITEA_JOB_TOKEN: ${{ gitea.token }}
          REPOSITORY_URL: https://sdp.ms.wits.ac.za/gradient-ascent/Wits-World.git
        run: |
          set -euo pipefail

          BADGE_SOURCE="$PWD/coverage/coverage.svg"
          BADGE_REPOSITORY="$(mktemp -d)"
          trap 'rm -rf "$BADGE_REPOSITORY"' EXIT

          AUTH_HEADER="$(
            printf 'x-access-token:%s' "$GITEA_JOB_TOKEN" |
              base64 -w0
          )"

          git init "$BADGE_REPOSITORY"
          cd "$BADGE_REPOSITORY"
          git remote add origin "$REPOSITORY_URL"

          if git \
            -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
            ls-remote --exit-code --heads origin coverage-badge >/dev/null 2>&1
          then
            git \
              -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
              fetch --depth=1 origin coverage-badge
            git checkout -B coverage-badge FETCH_HEAD
          else
            git checkout --orphan coverage-badge
          fi

          cp "$BADGE_SOURCE" coverage.svg
          git add coverage.svg

          if git diff --cached --quiet
          then
            echo "Coverage badge is already current."
            exit 0
          fi

          git config user.name "Wits World CI"
          git config user.email "wits-world-ci@users.noreply.sdp.ms.wits.ac.za"
          git commit -m "[skip ci] update coverage badge"
          git \
            -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
            push origin HEAD:coverage-badge

  deploy-api:
    name: Deploy API to Azure
    needs:
      - validation
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: azure-deploy

    env:
      DEPLOY_SHA: ${{ gitea.sha }}
      PREVIOUS_SHA: ${{ gitea.event.before }}
      GITEA_JOB_TOKEN: ${{ gitea.token }}
      REPOSITORY_URL: https://sdp.ms.wits.ac.za/gradient-ascent/Wits-World.git
      AZURE_RESOURCE_GROUP: witsworld-rg
      AZURE_WEBAPP_NAME: witsworld-api

    steps:
      - name: Check out exact main commit
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          rm -rf "$DEPLOY_ROOT"
          mkdir -p "$DEPLOY_ROOT/repository"

          cd "$DEPLOY_ROOT/repository"

          git init
          git remote add origin "$REPOSITORY_URL"

          AUTH_HEADER="$(
            printf 'x-access-token:%s' "$GITEA_JOB_TOKEN" |
              base64 -w0
          )"

          git \
            -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
            fetch --depth=2 origin "$DEPLOY_SHA"

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            git \
              -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
              fetch --depth=1 origin "$PREVIOUS_SHA" || true
          fi

          git checkout --detach "$DEPLOY_SHA"

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "Expected commit: $DEPLOY_SHA"
            echo "Fetched commit:  $ACTUAL_SHA"
            echo "Refusing to deploy the wrong commit."
            exit 1
          fi

      - name: Detect API deployment changes
        id: api_deployment_changes
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"
          DEPLOY_MARKER="$DEPLOY_ROOT/deploy-required"

          cd "$DEPLOY_ROOT/repository"
          rm -f "$DEPLOY_MARKER"

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            BASE_SHA="$PREVIOUS_SHA"
          else
            echo "The push-before commit is unavailable; API deployment is required."
            touch "$DEPLOY_MARKER"
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$DEPLOY_SHA" -- \
            .gitea/workflows/ci.yml \
            .nvmrc \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            apps/api \
            packages/account-policy \
            packages/game-rules \
            scripts/prepare-api.mjs \
            database
          then
            echo "No API, database, or shared runtime changes detected; API deployment will be skipped."
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "API, database, or shared runtime changes detected; API deployment is required."
            touch "$DEPLOY_MARKER"
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download production API artifact
        if: ${{ steps.api_deployment_changes.outputs.required == 'true' }}
        # Keep the known-working v3 protocol until v4 is verified on this Gitea instance.
        uses: https://github.com/actions/download-artifact@v3
        with:
          name: api-deploy-${{ gitea.sha }}
          path: /tmp/witsworld-api-deploy-${{ gitea.sha }}

      - name: Verify production API artifact
        if: ${{ steps.api_deployment_changes.outputs.required == 'true' }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          test -f "$DEPLOY_ROOT/commit-sha.txt"
          test -f "$DEPLOY_ROOT/witsworld-api-deploy.zip"
          test -f "$DEPLOY_ROOT/witsworld-api-deploy.zip.sha256"

          ARTIFACT_SHA="$(tr -d '\r\n' < "$DEPLOY_ROOT/commit-sha.txt")"

          if [ "$ARTIFACT_SHA" != "$DEPLOY_SHA" ]; then
            echo "Expected artifact commit: $DEPLOY_SHA"
            echo "Downloaded artifact commit: $ARTIFACT_SHA"
            echo "Refusing to deploy an artifact for a different commit."
            exit 1
          fi

          (
            cd "$DEPLOY_ROOT"
            sha256sum --check witsworld-api-deploy.zip.sha256
          )

          unzip -t "$DEPLOY_ROOT/witsworld-api-deploy.zip" >/dev/null

          ARTIFACT_CONTENTS="$DEPLOY_ROOT/artifact-contents.txt"
          unzip -Z1 "$DEPLOY_ROOT/witsworld-api-deploy.zip" > "$ARTIFACT_CONTENTS"

          require_artifact_path() {
            local required_path="$1"

            if ! grep -Fx "$required_path" "$ARTIFACT_CONTENTS"; then
              echo "Required artifact path is missing: $required_path"
              return 1
            fi
          }

          for required_path in \
            package.json \
            package-lock.json \
            apps/api/package.json \
            apps/api/dist/server.js \
            apps/api/dist/database/release.js \
            node_modules/@wits-world/account-policy/package.json \
            node_modules/@wits-world/account-policy/dist/src/index.js \
            node_modules/@wits-world/game-rules/package.json \
            node_modules/@wits-world/game-rules/dist/src/index.js \
            node_modules/@fastify/cors/package.json \
            node_modules/@fastify/swagger/package.json \
            node_modules/@fastify/swagger-ui/package.json \
            node_modules/dotenv/package.json \
            node_modules/fastify/package.json \
            node_modules/jose/package.json \
            node_modules/pg/package.json
          do
            require_artifact_path "$required_path"
          done

          DATABASE_FILE_COUNT=0

          while IFS= read -r required_path
          do
            require_artifact_path "$required_path"
            DATABASE_FILE_COUNT=$((DATABASE_FILE_COUNT + 1))
          done < <(
            git -C "$DEPLOY_ROOT/repository" ls-files -- database
          )

          if [ "$DATABASE_FILE_COUNT" -eq 0 ]; then
            echo "The deployment commit does not contain tracked database files."
            exit 1
          fi

      - name: Set up Node.js for production database release
        if: ${{ steps.api_deployment_changes.outputs.required == 'true' }}
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: /tmp/witsworld-api-deploy-${{ gitea.sha }}/repository/.nvmrc

      - name: Release production database
        if: ${{ steps.api_deployment_changes.outputs.required == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CONFIRM_DATABASE: ${{ vars.PRODUCTION_DATABASE_NAME }}
          CONFIRM_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"
          RELEASE_ROOT="$DEPLOY_ROOT/database-release"

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi

          if [ -z "${CONFIRM_DATABASE:-}" ]; then
            echo "PRODUCTION_DATABASE_NAME is not configured."
            exit 1
          fi

          if [ -z "${CONFIRM_DATABASE_HOST:-}" ]; then
            echo "PRODUCTION_DATABASE_HOST is not configured."
            exit 1
          fi

          # Confirm that the secret points to the expected production Neon host
          # before allowing any database release procedure to run.
          node --input-type=module <<'NODE'
          const connectionString = process.env.DATABASE_URL;
          const expectedDatabase = process.env.CONFIRM_DATABASE;
          const expectedHost = process.env.CONFIRM_DATABASE_HOST;

          if (!connectionString) {
            throw new Error('DATABASE_URL is missing.');
          }

          const url = new URL(connectionString);
          const actualDatabase = url.pathname.replace(/^\/+/, '');

          if (url.hostname !== expectedHost) {
            throw new Error(
              `Production database host confirmation failed: expected ${expectedHost}, received ${url.hostname}.`,
            );
          }

          if (actualDatabase !== expectedDatabase) {
            throw new Error(
              `Production database name confirmation failed: expected ${expectedDatabase}, received ${actualDatabase}.`,
            );
          }

          console.log(`Confirmed production database host: ${url.hostname}`);
          console.log(`Confirmed production database name: ${actualDatabase}`);
          NODE

          rm -rf "$RELEASE_ROOT"
          mkdir -p "$RELEASE_ROOT"

          unzip -q \
            "$DEPLOY_ROOT/witsworld-api-deploy.zip" \
            -d "$RELEASE_ROOT"

          test -f "$RELEASE_ROOT/apps/api/dist/database/release.js"
          test -d "$RELEASE_ROOT/database/migrations"
          test -d "$RELEASE_ROOT/node_modules"

          (
            cd "$RELEASE_ROOT"

            node apps/api/dist/database/release.js \
              --target production \
              --confirm-database "$CONFIRM_DATABASE"
          )

          echo "Production database release completed successfully."

      - name: Authenticate to Azure
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping Azure authentication for the API."
            exit 0
          fi

          az login --identity --output none
          az account set --subscription "Azure for Students"

          az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query '{name:name,state:state}' \
            --output table

      - name: Deploy API to Azure
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping the API deployment."
            exit 0
          fi

          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path "$DEPLOY_ROOT/witsworld-api-deploy.zip" \
            --type zip \
            --clean true \
            --restart true \
            --track-status false \
            --output none

      - name: Verify production health
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping API health verification because no deployment occurred."
            exit 0
          fi

          API_HOST="$(
            az webapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query defaultHostName \
              --output tsv
          )"

          HEALTH_BODY="$(mktemp)"

          for attempt in $(seq 1 60); do
            STATUS="$(
              curl \
                --silent \
                --show-error \
                --output "$HEALTH_BODY" \
                --write-out '%{http_code}' \
                --max-time 10 \
                "https://${API_HOST}/health" || true
            )"

            if [ "$STATUS" = "200" ]; then
              echo "Production API is healthy:"
              cat "$HEALTH_BODY"
              rm -f "$HEALTH_BODY"
              exit 0
            fi

            echo "Health check ${attempt}/60 returned '${STATUS:-request-error}'."
            sleep 10
          done

          echo "Production API did not become healthy."
          rm -f "$HEALTH_BODY"

          az webapp log startup show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" || true

          exit 1

      - name: Clean deployment workspace
        if: ${{ always() }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-api-deploy-${DEPLOY_SHA}"

          az logout >/dev/null 2>&1 || true

          if [ -d "$DEPLOY_ROOT" ]; then
            docker run --rm \
              -v "$DEPLOY_ROOT:/cleanup" \
              node:24-bookworm-slim \
              sh -lc 'rm -rf /cleanup/* /cleanup/.[!.]* /cleanup/..?*'

            rm -rf "$DEPLOY_ROOT"
          fi

  deploy-web:
    name: Deploy Web to Azure
    needs:
      - validation
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: azure-deploy

    env:
      DEPLOY_SHA: ${{ gitea.sha }}
      PREVIOUS_SHA: ${{ gitea.event.before }}
      GITEA_JOB_TOKEN: ${{ gitea.token }}
      REPOSITORY_URL: https://sdp.ms.wits.ac.za/gradient-ascent/Wits-World.git
      AZURE_RESOURCE_GROUP: witsworld-rg
      AZURE_WEBAPP_NAME: witsworld-web

    steps:
      - name: Check out exact main commit
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          rm -rf "$DEPLOY_ROOT"
          mkdir -p "$DEPLOY_ROOT/repository"

          cd "$DEPLOY_ROOT/repository"

          git init
          git remote add origin "$REPOSITORY_URL"

          AUTH_HEADER="$(
            printf 'x-access-token:%s' "$GITEA_JOB_TOKEN" |
              base64 -w0
          )"

          git \
            -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
            fetch --depth=2 origin "$DEPLOY_SHA"

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            git \
              -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
              fetch --depth=1 origin "$PREVIOUS_SHA" || true
          fi

          git checkout --detach "$DEPLOY_SHA"

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "Expected commit: $DEPLOY_SHA"
            echo "Fetched commit:  $ACTUAL_SHA"
            echo "Refusing to deploy the wrong commit."
            exit 1
          fi

      - name: Detect web deployment changes
        id: web_deployment_changes
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"
          DEPLOY_MARKER="$DEPLOY_ROOT/deploy-required"

          cd "$DEPLOY_ROOT/repository"
          rm -f "$DEPLOY_MARKER"

          if [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] && \
            [ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ] && \
            git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null
          then
            BASE_SHA="$PREVIOUS_SHA"
          else
            echo "The push-before commit is unavailable; web deployment is required."
            touch "$DEPLOY_MARKER"
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$DEPLOY_SHA" -- \
            .gitea/workflows/ci.yml \
            .nvmrc \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            apps/web \
            packages/account-policy
          then
            echo "No web or shared runtime changes detected; web deployment will be skipped."
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "Web or shared runtime changes detected; web deployment is required."
            touch "$DEPLOY_MARKER"
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download production web artifact
        if: ${{ steps.web_deployment_changes.outputs.required == 'true' }}
        # Keep the known-working v3 protocol until v4 is verified on this Gitea instance.
        uses: https://github.com/actions/download-artifact@v3
        with:
          name: web-deploy-${{ gitea.sha }}
          path: /tmp/witsworld-web-deploy-${{ gitea.sha }}

      - name: Verify production web artifact
        if: ${{ steps.web_deployment_changes.outputs.required == 'true' }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          test -f "$DEPLOY_ROOT/commit-sha.txt"
          test -f "$DEPLOY_ROOT/witsworld-web-deploy.zip"
          test -f "$DEPLOY_ROOT/witsworld-web-deploy.zip.sha256"

          ARTIFACT_SHA="$(tr -d '\r\n' < "$DEPLOY_ROOT/commit-sha.txt")"

          if [ "$ARTIFACT_SHA" != "$DEPLOY_SHA" ]; then
            echo "Expected artifact commit: $DEPLOY_SHA"
            echo "Downloaded artifact commit: $ARTIFACT_SHA"
            echo "Refusing to deploy an artifact for a different commit."
            exit 1
          fi

          (
            cd "$DEPLOY_ROOT"
            sha256sum --check witsworld-web-deploy.zip.sha256
          )

          unzip -t "$DEPLOY_ROOT/witsworld-web-deploy.zip" >/dev/null

          unzip -Z1 "$DEPLOY_ROOT/witsworld-web-deploy.zip" |
            grep -Fx 'index.html'

          unzip -Z1 "$DEPLOY_ROOT/witsworld-web-deploy.zip" |
            grep -E '^assets/.+'

      - name: Authenticate to Azure
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping Azure authentication for the web application."
            exit 0
          fi

          az login --identity --output none
          az account set --subscription "Azure for Students"

          az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query '{name:name,state:state}' \
            --output table

      - name: Deploy web application to Azure
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping the web deployment."
            exit 0
          fi

          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path "$DEPLOY_ROOT/witsworld-web-deploy.zip" \
            --type zip \
            --clean true \
            --restart true \
            --track-status false \
            --output none

      - name: Verify production website
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          if [ ! -f "$DEPLOY_ROOT/deploy-required" ]; then
            echo "Skipping web health verification because no deployment occurred."
            exit 0
          fi

          WEB_HOST="$(
            az webapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query defaultHostName \
              --output tsv
          )"

          for attempt in $(seq 1 60); do
            ROOT_STATUS="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 10 \
                "https://${WEB_HOST}/" || true
            )"

            ABOUT_STATUS="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 10 \
                "https://${WEB_HOST}/about" || true
            )"

            if [ "$ROOT_STATUS" = "200" ] && [ "$ABOUT_STATUS" = "200" ]; then
              echo "Production website is healthy."
              echo "Home:  HTTP ${ROOT_STATUS}"
              echo "About: HTTP ${ABOUT_STATUS}"
              exit 0
            fi

            echo "Website check ${attempt}/60: home=${ROOT_STATUS:-request-error}, about=${ABOUT_STATUS:-request-error}."
            sleep 10
          done

          echo "Production website did not become healthy."

          az webapp log startup show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" || true

          exit 1

      - name: Clean deployment workspace
        if: ${{ always() }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/tmp/witsworld-web-deploy-${DEPLOY_SHA}"

          az logout >/dev/null 2>&1 || true

          if [ -d "$DEPLOY_ROOT" ]; then
            rm -rf "$DEPLOY_ROOT"
          fi
