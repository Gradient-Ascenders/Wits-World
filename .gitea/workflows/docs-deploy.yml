name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - apps/docs/**
      - docs/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .gitea/workflows/docs-deploy.yml
  workflow_dispatch:

env:
  NPM_CONFIG_CACHE: /opt/wits-world/npm-cache

jobs:
  deploy-docs:
    name: Deploy documentation to Cloudflare Pages
    if: ${{ gitea.ref == 'refs/heads/main' }}
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build documentation
        run: npm run build --workspace @wits-world/docs
        env:
          DOCS_SITE_URL: https://wits-world-docs.pages.dev

      - name: Deploy documentation
        run: npm run deploy:cloudflare --workspace @wits-world/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
