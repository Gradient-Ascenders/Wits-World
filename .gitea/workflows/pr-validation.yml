name: Continuous Integration

on:
  pull_request:
    branches:
      - main

jobs:
  format:
    name: Check repository formatting
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint applications
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Lint applications
        run: npm run lint

  type-check:
    name: Type-check applications
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Type-check applications
        run: npm run type-check

  test:
    name: Test applications with coverage
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build shared game rules package
        run: npm run prepare:game-rules

      - name: Test web application with coverage
        run: npm run test:coverage --workspace @wits-world/web

      - name: Test API application with coverage
        run: npm run test:coverage --workspace @wits-world/api

      - name: Test documentation application
        run: npm test --workspace @wits-world/docs

      - name: Generate coverage badge
        run: npm run coverage:badge

      - name: Upload coverage reports
        if: ${{ always() }}
        # Keep the known-working v3 protocol until v4 is verified on this Gitea instance.
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build applications
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build shared game rules package
        run: npm run prepare:game-rules

      - name: Build web application
        run: npm run build:bundle --workspace @wits-world/web

      - name: Build API application
        run: npm run build --workspace @wits-world/api

      - name: Build documentation application
        run: npm run build --workspace @wits-world/docs

  validation:
    name: Repository and application validation
    needs:
      - format
      - lint
      - type-check
      - test
      - build
    runs-on: wits-world-ci

    steps:
      - name: Confirm validation gates passed
        run: echo "All repository and application validation jobs passed."
