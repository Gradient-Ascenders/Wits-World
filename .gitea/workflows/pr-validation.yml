name: Continuous Integration

on:
  pull_request:
    branches:
      - main

env:
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_factor: 2
  npm_config_fetch_retry_mintimeout: 10000
  npm_config_fetch_retry_maxtimeout: 60000

jobs:
  static-analysis:
    name: Run static analysis
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Check formatting, linting, and types
        run: |
          set +e

          FAILED_CHECKS=()

          run_check() {
            local label="$1"
            shift

            echo "::group::${label}"
            local started_at=$SECONDS

            "$@"
            local status=$?

            echo "${label} completed in $((SECONDS - started_at)) seconds with exit code ${status}."
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "::error::${label} failed with exit code ${status}."
              FAILED_CHECKS+=("$label")
            fi
          }

          run_check "Formatting check" npm run format:check
          run_check "Lint" npm run lint
          run_check "Type-check" npm run type-check

          if [ "${#FAILED_CHECKS[@]}" -ne 0 ]; then
            printf 'Static analysis failed: %s\n' "${FAILED_CHECKS[*]}"
            exit 1
          fi

          echo "All static-analysis checks passed."

  test:
    name: Test applications with coverage
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Test web application with coverage
        run: time npm run test:coverage --workspace @wits-world/web

      - name: Test API application with coverage
        run: time npm run validate:api:coverage

      - name: Test documentation application
        run: time npm test --workspace @wits-world/docs

      - name: Generate coverage badge
        run: time npm run coverage:badge

      - name: Upload coverage reports
        if: ${{ always() }}
        # Keep the known-working v3 protocol until v4 is verified on this Gitea instance.
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build applications
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Build web application
        run: time npm run build:bundle --workspace @wits-world/web

      - name: Build API application
        run: time npm run validate:api:build

      - name: Build documentation application
        run: time npm run build --workspace @wits-world/docs

  validation:
    name: Repository and application validation
    needs:
      - static-analysis
      - test
      - build
    runs-on: wits-world-ci

    steps:
      - name: Confirm validation gates passed
        run: echo "All repository and application validation jobs passed."
