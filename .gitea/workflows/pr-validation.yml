name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

env:
  NPM_CONFIG_CACHE: /opt/wits-world/npm-cache
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_factor: 2
  npm_config_fetch_retry_mintimeout: 10000
  npm_config_fetch_retry_maxtimeout: 60000

jobs:
  static-analysis:
    name: Run static analysis
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Check formatting, linting, and types
        run: |
          set +e

          FAILED_CHECKS=()

          run_check() {
            local label="$1"
            shift

            echo "::group::${label}"
            local started_at=$SECONDS

            "$@"
            local status=$?

            echo "${label} completed in $((SECONDS - started_at)) seconds with exit code ${status}."
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "::error::${label} failed with exit code ${status}."
              FAILED_CHECKS+=("$label")
            fi
          }

          run_check "Formatting check" npm run format:check
          run_check "Lint" npm run lint
          run_check "Type-check" npm run type-check

          if [ "${#FAILED_CHECKS[@]}" -ne 0 ]; then
            printf 'Static analysis failed: %s\n' "${FAILED_CHECKS[*]}"
            exit 1
          fi

          echo "All static-analysis checks passed."

  test:
    name: Test applications with coverage
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Test web application with coverage
        run: time npm run test:coverage --workspace @wits-world/web

      - name: Test API application with coverage
        run: time npm run validate:api:coverage

      - name: Test documentation application
        run: time npm test --workspace @wits-world/docs

      - name: Generate coverage badge
        run: time npm run coverage:badge

      - name: Upload coverage reports
        if: ${{ always() }}
        # Keep the known-working v3 protocol until v4 is verified on this Gitea instance.
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  database-validation:
    name: Validate database and migrations
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Confirm disposable test database is configured
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "::error::TEST_DATABASE_URL is not configured for pull-request database validation."
            echo "Configure it as a Gitea Actions secret pointing to a disposable PostgreSQL/PostGIS test database."
            exit 1
          fi

          node --input-type=module <<'NODE'
          const connectionString = process.env.TEST_DATABASE_URL;

          if (!connectionString) {
            throw new Error('TEST_DATABASE_URL is missing.');
          }

          const url = new URL(connectionString);

          if (url.protocol !== 'postgres:' && url.protocol !== 'postgresql:') {
            throw new Error(
              'TEST_DATABASE_URL must be a PostgreSQL connection string.',
            );
          }

          const database = url.pathname.replace(/^\/+/, '');

          if (!url.hostname || !database) {
            throw new Error(
              'TEST_DATABASE_URL must contain a database hostname and database name.',
            );
          }

          console.log(`Test database host: ${url.hostname}`);
          console.log(`Test database name: ${database}`);
          NODE

      - name: Prepare shared API dependencies
        run: time npm run prepare:api

      - name: Verify test database readiness
        env:
          # Deliberately unusable development target. The API database
          # configuration requires DATABASE_URL when validating TEST_DATABASE_URL,
          # but PR CI must never receive development or production credentials.
          DATABASE_URL: postgresql://ci-guard:ci-guard@127.0.0.1:1/wits_world_ci_guard
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          time npm run db:check:test --workspace @wits-world/api

      - name: Run database integration and migration tests
        env:
          # Keep the ordinary database target deliberately unusable so an
          # accidental non-test connection fails rather than touching real data.
          DATABASE_URL: postgresql://ci-guard:ci-guard@127.0.0.1:1/wits_world_ci_guard
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          time npm run test:database --workspace @wits-world/api

  build:
    name: Build applications
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Build web application
        run: time npm run build:bundle --workspace @wits-world/web

      - name: Build API application
        run: time npm run validate:api:build

      - name: Build documentation application
        run: time npm run build --workspace @wits-world/docs

  validation:
    name: Repository and application validation
    needs:
      - static-analysis
      - test
      - database-validation
      - build
    runs-on: wits-world-ci

    steps:
      - name: Confirm validation gates passed
        run: |
          echo "All pull-request validation jobs passed."
          echo "Static analysis: passed"
          echo "Application tests and coverage: passed"
          echo "Database and migration validation: passed"
          echo "Application builds: passed"
