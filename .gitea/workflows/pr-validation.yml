name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NPM_CONFIG_CACHE: /opt/wits-world/npm-cache
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_factor: 2
  npm_config_fetch_retry_mintimeout: 10000
  npm_config_fetch_retry_maxtimeout: 60000

jobs:
  static-analysis:
    name: Run static analysis
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Check formatting, linting, and types
        run: |
          set +e

          FAILED_CHECKS=()

          run_check() {
            local label="$1"
            shift

            echo "::group::${label}"
            local started_at=$SECONDS

            "$@"
            local status=$?

            echo "${label} completed in $((SECONDS - started_at)) seconds with exit code ${status}."
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "::error::${label} failed with exit code ${status}."
              FAILED_CHECKS+=("$label")
            fi
          }

          run_check "Formatting check" npm run format:check
          run_check "Lint" npm run lint
          run_check "Type-check" npm run type-check

          if [ "${#FAILED_CHECKS[@]}" -ne 0 ]; then
            printf 'Static analysis failed: %s\n' "${FAILED_CHECKS[*]}"
            exit 1
          fi

          echo "All static-analysis checks passed."

  test:
    name: Test applications with coverage
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Test shared account policy package
        run: time npm test --workspace @wits-world/account-policy

      - name: Test shared game rules package
        run: time npm test --workspace @wits-world/game-rules

      - name: Test web application with coverage
        run: time npm run test:coverage --workspace @wits-world/web

      - name: Test API application with coverage
        run: time npm run validate:api:coverage

      - name: Test documentation application
        run: time npm test --workspace @wits-world/docs

      - name: Generate coverage badge
        run: time npm run coverage:badge

      - name: Upload coverage reports
        if: ${{ always() }}
        # Keep the known-working v3 protocol until v4 is verified on this Gitea instance.
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  database-validation:
    name: Validate database and migrations
    runs-on: wits-world-ci

    services:
      postgres:
        image: docker.io/postgis/postgis:17-3.5
        env:
          POSTGRES_DB: wits_world_test
          POSTGRES_USER: wits_world_ci
          POSTGRES_PASSWORD: wits_world_ci
        options: >-
          --health-cmd "pg_isready -U wits_world_ci -d wits_world_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The service name is a network alias in this job's isolated network.
      TEST_DATABASE_URL: postgresql://wits_world_ci:wits_world_ci@postgres:5432/wits_world_test
      # Keep the ordinary target deliberately unusable so an accidental
      # non-test connection fails rather than touching real data.
      DATABASE_URL: postgresql://ci-guard:ci-guard@127.0.0.1:1/wits_world_ci_guard
      DATABASE_TEST_WORKERS: '4'

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Prepare shared API dependencies
        run: time npm run prepare:api

      - name: Verify isolated test database readiness
        run: |
          set -euo pipefail

          time npm run db:check:test --workspace @wits-world/api

      - name: Run database integration and migration tests
        run: |
          set -euo pipefail

          time npm run test:database --workspace @wits-world/api

  basic-e2e:
    name: Run Basic Playwright E2E
    runs-on: wits-world-ci
    timeout-minutes: 20

    services:
      postgres:
        image: docker.io/postgis/postgis:17-3.5
        env:
          POSTGRES_DB: wits_world_test
          POSTGRES_USER: wits_world_ci
          POSTGRES_PASSWORD: wits_world_ci
        options: >-
          --health-cmd "pg_isready -U wits_world_ci -d wits_world_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The service name is a network alias in this job's isolated network.
      TEST_DATABASE_URL: postgresql://wits_world_ci:wits_world_ci@postgres:5432/wits_world_test
      # Keep the ordinary target deliberately unusable so an accidental
      # non-test connection fails rather than touching real data.
      DATABASE_URL: postgresql://ci-guard:ci-guard@127.0.0.1:1/wits_world_ci_guard
      # Fingerprint of the isolated service, not the remote test database.
      TEST_DATABASE_IDENTITY_SHA256: 4a6736eba1415ce3781722f0e84c7d32956e568531c2149ce6c0f17cbcc95de2
      VERIFICATION_SANITIZE_OUTPUT: 'true'
      CI: 'true'

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Install Chromium and browser dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run isolated Basic E2E verification
        run: time npm run verify:automated -- --profile pr-e2e

      - name: Run Explore, Author, and Account experience regressions
        run: time npm run test:e2e:experience-regressions

      - name: Upload sanitized E2E verification summary
        if: ${{ always() }}
        # Never upload raw reports, traces, screenshots, logs, or auth state.
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: basic-e2e-verification-${{ gitea.sha }}
          path: |
            .playwright-artifacts/verification/summary.json
            .playwright-artifacts/verification/playwright-diagnostics.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build applications
    runs-on: wits-world-ci

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Build web application
        run: time npm run build:bundle --workspace @wits-world/web

      - name: Build API application
        run: time npm run validate:api:build

      - name: Build documentation application
        run: time npm run build --workspace @wits-world/docs

  validation:
    name: Repository and application validation
    needs:
      - static-analysis
      - test
      - database-validation
      - basic-e2e
      - build
    if: ${{ always() }}
    runs-on: wits-world-ci

    steps:
      - name: Confirm validation gates passed
        env:
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DATABASE_VALIDATION_RESULT: ${{ needs.database-validation.result }}
          BASIC_E2E_RESULT: ${{ needs.basic-e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          FAILED_GATES=()

          check_gate() {
            local label="$1"
            local result="$2"

            echo "${label}: ${result}"

            if [ "$result" != "success" ]; then
              FAILED_GATES+=("${label}=${result}")
            fi
          }

          check_gate "Static analysis" "$STATIC_ANALYSIS_RESULT"
          check_gate "Application and explicit shared-package tests" "$TEST_RESULT"
          check_gate "Isolated database and migration validation" "$DATABASE_VALIDATION_RESULT"
          check_gate "Basic Playwright E2E" "$BASIC_E2E_RESULT"
          check_gate "Application builds" "$BUILD_RESULT"

          if [ "${#FAILED_GATES[@]}" -ne 0 ]; then
            printf 'Pull-request validation failed: %s\n' "${FAILED_GATES[*]}"
            exit 1
          fi

          echo "All pull-request validation jobs passed."
