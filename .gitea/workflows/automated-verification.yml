name: Database, Package, and Basic E2E Verification

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Run the nightly profile or the pre-release gate.
        required: true
        type: choice
        default: release
        options:
          - release
          - nightly
      release_commit_sha:
        description: Full lowercase commit SHA; required for the release profile.
        required: false
        type: string
      prove_failure_gate:
        description: Fail safely before database access to prove gate enforcement.
        required: false
        type: boolean
        default: false

env:
  NPM_CONFIG_CACHE: /opt/wits-world/npm-cache
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_factor: 2
  npm_config_fetch_retry_mintimeout: 10000
  npm_config_fetch_retry_maxtimeout: 60000

jobs:
  verify:
    name: Run ${{ gitea.event_name }} verification gate
    runs-on: wits-world-ci
    timeout-minutes: 135
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # Non-secret fingerprint of host:port/database for the approved direct
      # Neon test target. Changing the URL alone cannot redirect this gate.
      TEST_DATABASE_IDENTITY_SHA256: 6e7d642299a01f407cd7ce88eaa9948dfe3799828124b83890b97bdb89f44e79
      DATABASE_URL: postgresql://ci-guard:ci-guard@127.0.0.1:1/wits_world_ci_guard
      DATABASE_TEST_WORKERS: '1'
      RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
      VERIFICATION_SANITIZE_OUTPUT: 'true'

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: time npm ci --prefer-offline --no-audit --fund=false

      - name: Resolve and validate verification profile
        id: verification_profile
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail

          if [ "${{ gitea.event_name }}" = "schedule" ]; then
            PROFILE=nightly
          else
            PROFILE="$REQUESTED_PROFILE"
          fi

          case "$PROFILE" in
            nightly|release) ;;
            *)
              echo "Unsupported verification profile."
              exit 1
              ;;
          esac

          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Resolved verification profile: $PROFILE"

      - name: Run deliberate fail-closed gate probe
        if: ${{ inputs.prove_failure_gate == true }}
        run: npm run verify:failure-probe

      - name: Run package, database, migration, and Basic E2E verification
        if: ${{ inputs.prove_failure_gate != true }}
        run: >-
          time npm run verify:automated --
          --profile ${{ steps.verification_profile.outputs.profile }}

      - name: Upload sanitized verification summary
        if: ${{ always() }}
        # Do not upload Playwright output, traces, screenshots, logs, environment
        # dumps, database rows, or auth state from this privacy-sensitive journey.
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: automated-verification-${{ gitea.sha }}
          path: .playwright-artifacts/verification/summary.json
          if-no-files-found: error
          retention-days: 14
