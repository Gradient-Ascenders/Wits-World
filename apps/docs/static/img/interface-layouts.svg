  <title id="title">Interface layout relationships</title>
  <desc id="description">
    Four schematic layouts. Explore puts event availability beside the start
    action; deck editing puts the draft beside the collection; battles put
    combatants above action choices with history alongside; authoring separates
    draft saving from lifecycle actions. Callout 1 marks decision context and
    callout 2 marks the related controls. These illustrations are not
    screenshots.
  </desc>
